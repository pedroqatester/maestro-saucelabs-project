appId: com.saucelabs.mydemoapp.rn
name: Flow - Login Invalid Credentials
tags:
  - login
  - negative
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Catalog"
    timeout: 30000
- runFlow:
    file: ../../../commands/login.yaml
    env:
      MAESTRO_USERNAME: "invalid"
      MAESTRO_EMAIL_DOMAIN: "${MAESTRO_EMAIL_DOMAIN}"
      MAESTRO_PASSWORD: "wrongpassword"
- assertVisible: "Provided credentials do not match any user in this service."
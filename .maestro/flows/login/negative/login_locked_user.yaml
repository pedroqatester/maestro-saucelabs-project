appId: com.saucelabs.mydemoapp.rn
tags:
  - login
  - negative
---
- launchApp:
    clearState: true
- runFlow:
    file: ../../../commands/login.yaml
    env:
      MAESTRO_USERNAME: "${MAESTRO_LOCKED_USERNAME}"
      MAESTRO_PASSWORD: "${MAESTRO_LOCKED_PASSWORD}"
- assertVisible: "Sorry, this user has been locked out."
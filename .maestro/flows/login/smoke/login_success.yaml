appId: com.saucelabs.mydemoapp.rn
name: Flow - Login Success
tags:
  - login
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Products"
    timeout: 30000
- runFlow:
    file: ../../../commands/login.yaml
    env:
      MAESTRO_USERNAME: "${MAESTRO_USERNAME}"
      MAESTRO_PASSWORD: "${MAESTRO_PASSWORD}"
- assertVisible: "PRODUCTS"
appId: com.saucelabs.mydemoapp.rn
name: Flow - Checkout Smoke Test full - Step by step until order confirmation
tags:
  - checkout
  - smoke
---
- launchApp:
    clearState: true
- runFlow:
    file: ../../../commands/add_product_to_cart.yaml
    env:
      PRODUCT_NAME: "Sauce Labs Backpack"
- runFlow:
    file: ../../../commands/proceed_to_checkout.yaml
- runFlow:
    file: ../../../flows/login/common/login_fill_form.yaml
- runFlow:
    file: ../../../flows/checkout/common/checkout_fill_form.yaml
- runFlow:
    file: ../../../flows/checkout/common/checkout_buttons.yaml
    env:
      PROCEED_TO_PAYMENT: true
- runFlow:
    file: ../../../flows/checkout/common/checkout_fill_payment_method.yaml
- runFlow:
    file: ../../../flows/checkout/common/checkout_buttons.yaml
    env:
      PROCEED_TO_REVIEW_ORDER: true

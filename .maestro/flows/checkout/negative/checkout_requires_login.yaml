appId: com.saucelabs.mydemoapp.rn
tags:
  - checkout
  - negative
---
- launchApp:
    clearState: true
- runFlow:
    file: ../../../commands/add_product_to_cart.yaml
    env:
      PRODUCT_NAME: "Sauce Labs Backpack"
- tapOn: "cart badge"
- tapOn: "Proceed To Checkout"
- assertVisible: "Username input field"
- assertVisible: "Login button"
appId: com.saucelabs.mydemoapp.rn
name: Checkout Negative Test - Requires Login before buying
tags:
  - checkout
  - negative
---
- launchApp:
    clearState: true
- runFlow:
    file: ../../../commands/add_product_to_cart.yaml
    env:
      PRODUCT_NAME: "Sauce Labs Backpack"
- runFlow:
    file: ../../../commands/proceed_to_checkout.yaml
- runFlow:
    file: ../../../flows/login/common/login_screen.yaml